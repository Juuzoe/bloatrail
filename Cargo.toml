[package]
name = "bloatrail"
version = "0.2.0"
default-run = "bloatrail"
edition = "2021"
rust-version = "1.82"
authors = ["Maksym Gavrylenko"]
description = "A developer-aware disk space analyser and safe cleanup tool"
documentation = "https://docs.rs/bloatrail"
readme = "README.md"
repository = "https://github.com/Juuzoe/bloatrail"
license = "MIT"
keywords = ["disk", "cleanup", "cli", "storage", "developer-tools"]
categories = ["command-line-utilities", "filesystem"]
# `/benches` is deliberately kept: excluding it makes `cargo package` drop the
# declared bench targets with a warning.
exclude = ["/.github", "/docs"]

[lib]
name = "bloatrail"
path = "src/lib.rs"

[[bin]]
name = "bloatrail"
path = "src/main.rs"

# The desktop app. Feature-gated so `cargo build` stays lean for CLI-only use.
[[bin]]
name = "bloatrail-gui"
path = "src/bin/gui/main.rs"
required-features = ["gui"]

[features]
default = []
gui = ["dep:eframe", "dep:rfd", "dep:image"]

[dependencies]
anstream = "0.6"
anstyle = "1"
anyhow = "1"
bitflags = { version = "2", features = ["serde"] }
blake3 = "1"
clap = { version = "4", features = ["derive", "wrap_help", "env"] }
clap_complete = "4"
ctrlc = "3"
dirs = "5"
eframe = { version = "0.29", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
rayon = "1"
rfd = { version = "0.15", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
thiserror = "2"
toml = "0.8"
trash = "5"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = "0.5"
tempfile = "3"

[[bench]]
name = "scanner"
harness = false

[[bench]]
name = "classification"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

# `cargo build --profile profiling` keeps symbols for perf/flamegraph work.
[profile.profiling]
inherits = "release"
debug = true
strip = false
panic = "unwind"

# Benchmarks keep symbols so profiles are readable.
[profile.bench]
inherits = "release"
strip = false
debug = true
