name: Release

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  # A tag is public the moment it is pushed, so the cheapest check runs first:
  # a tag that disagrees with Cargo.toml would publish archives named after a
  # version the binaries inside do not report.
  check-version:
    name: Tag matches Cargo.toml
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          tag='${{ github.ref_name }}'
          manifest=$(sed -n '/^\[package\]/,/^\[/ s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          echo "tag=$tag  Cargo.toml=$manifest"
          if [ "$tag" != "v$manifest" ]; then
            echo "::error::Tag $tag does not match version $manifest in Cargo.toml"
            exit 1
          fi

  # The archives come from the read-only build workflow, which the rehearsal
  # runs too, so what a tag publishes is what pull requests have been building
  # all along.
  build:
    name: Build
    needs: check-version
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # One checksum file covering every asset is easier to verify than seven
      # separate ones, and both install scripts read it directly.
      - name: Collect checksums
        run: |
          cd artifacts
          cat *.sha256 | sort -k2 > SHA256SUMS
          rm -f *.sha256
          ls -la

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
          body_path: .github/release-body.md
          fail_on_unmatched_files: true

  crates-io:
    name: Publish to crates.io
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Skipped rather than failed when no token is configured, so the GitHub
      # release still succeeds on a repository that does not publish crates.
      - name: Publish
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "CARGO_REGISTRY_TOKEN is not set; skipping crates.io publish." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          cargo publish --locked --token "$TOKEN"
