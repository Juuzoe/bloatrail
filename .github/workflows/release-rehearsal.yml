name: Release rehearsal

# A tag is public the moment it is pushed, so the release build gets exercised
# before one exists. Whenever the packaging changes, every target is built and
# archived exactly as a release would, and the archives are left on the run for
# inspection. Nothing is published: this calls only the read-only half.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/release*.yml"
      - "install.sh"
      - "install.ps1"
      - "Cargo.toml"
      - "Cargo.lock"
  pull_request:
    paths:
      - ".github/workflows/release*.yml"
      - "Cargo.toml"
      - "Cargo.lock"

jobs:
  rehearse:
    name: Rehearse
    uses: ./.github/workflows/release-build.yml
    permissions:
      contents: read
