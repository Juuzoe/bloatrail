name: Publish to crates.io

# Publishing a tag that already exists, without rebuilding or touching its
# GitHub release. The release workflow publishes automatically on a new tag;
# this is for filling in a version that was tagged before the registry token
# existed, or for retrying a publish that failed on its own.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to publish. Leave empty for the newest tag."
        required: false
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: cargo publish
    runs-on: ubuntu-latest
    steps:
      # The default branch is checked out rather than the tag directly, so that
      # a tag which does not exist produces an explanation instead of a bare
      # "git failed with exit code 1" from inside the checkout action.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve the tag
        id: resolve
        run: |
          set -euo pipefail
          # Tolerate a stray space and a missing or present leading "v", so the
          # difference between 0.3.0 and v0.3.0 is not a failed run.
          raw=$(printf '%s' '${{ inputs.tag }}' | tr -d '[:space:]')

          # Empty means the newest tag, which is what this is nearly always
          # run for. Typing a version that does not exist should not be the
          # normal way to use it.
          if [ -z "$raw" ]; then
            raw=$(git describe --tags --abbrev=0)
            echo "No version given; using the newest tag."
          fi

          case "$raw" in
            v*) tag="$raw" ;;
            V*) tag="v${raw#V}" ;;
            *)  tag="v$raw" ;;
          esac

          if ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::No tag named $tag. Tags in this repository:"
            git tag -l | sed 's/^/  /'
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Publishing $tag ($(git rev-parse --short "$tag^{commit}"))"

      - name: Check out the tag
        run: git checkout --detach "${{ steps.resolve.outputs.tag }}"

      - uses: dtolnay/rust-toolchain@stable

      # Cheaper to fail here than halfway through an upload that cannot be
      # undone: a published version can be yanked but never replaced.
      - name: Check the tag matches Cargo.toml
        run: |
          set -euo pipefail
          tag='${{ steps.resolve.outputs.tag }}'
          manifest=$(sed -n '/^\[package\]/,/^\[/ s/^version *= *"\([^"]*\)".*/\1/p' Cargo.toml | head -n 1)
          echo "tag=$tag  Cargo.toml=$manifest"
          if [ "$tag" != "v$manifest" ]; then
            echo "::error::Tag $tag does not match version $manifest in Cargo.toml"
            exit 1
          fi

      - name: Publish
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          cargo publish --locked --token "$TOKEN"
