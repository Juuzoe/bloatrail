name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Run on every platform: the scanner's `#[cfg]`-gated code differs per OS,
      # so a Linux-only lint pass would never see the Windows or macOS paths.
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --all-targets --verbose
      - name: Test
        run: cargo test --all-targets --verbose
      # `cargo test --all-targets` skips doctests, so run them separately.
      - name: Doctests
        run: cargo test --doc --verbose

  # Both numbers the README quotes get checked, because a stated MSRV nobody
  # tests is a guess. The CLI and the desktop app have different minimums:
  # eframe and rfd pull in crates that ask for more than the CLI needs.
  msrv:
    name: MSRV ${{ matrix.rust }} (${{ matrix.what }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: "1.85.0"
            what: CLI
            args: --all-targets
          - rust: "1.86.0"
            what: desktop app
            args: --features gui
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
      # `--locked` is the point of this job. Re-resolving would pull whatever
      # the registry offers today, and the ecosystem's latest releases raise
      # their own MSRV faster than this crate does, so the check would measure
      # our dependencies rather than us. The committed lockfile is the
      # dependency set users get, so it is the one worth testing.
      - run: cargo check --locked ${{ matrix.args }}

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features

  benchmarks:
    name: benchmarks compile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Timings from a shared CI runner are meaningless, so the benchmarks are
      # only checked for compilation and a single sanity iteration.
      - run: cargo bench --no-run
      - run: cargo bench -- --test
